name: Lighthouse
# Dispatch only: audits are long and gate nothing a push can break.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: docker build -t totative-dev .
      - name: Run the container
        run: |
          set -euo pipefail
          docker run -d --name site -p 8080:8080 totative-dev
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
      # filesystem upload in lighthouserc.json: LHCI's default is temporary-public-storage
      - run: bunx @lhci/cli@0.16.0 autorun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() # keep the report when assertions fail
        with:
          name: lighthouse-reports
          path: .lighthouseci
