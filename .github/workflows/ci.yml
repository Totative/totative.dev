name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: docker build -t totative-dev .
      - name: Assert the container
        run: |
          set -euo pipefail
          docker run -d --name site -p 8080:8080 totative-dev
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          hdr=$(curl -sI http://127.0.0.1:8080/)
          echo "$hdr"
          echo "$hdr" | grep -qE '^HTTP/[^ ]+ 200'
          echo "$hdr" | grep -i '^content-security-policy:' | grep -F "default-src 'none'"
          echo "$hdr" | grep -i '^content-security-policy:' | grep -F "script-src 'self'"
          echo "$hdr" | grep -i '^content-security-policy:' | grep -F "style-src 'self'"
          echo "$hdr" | grep -i '^content-security-policy:' | grep -F "img-src 'self' data:"
          echo "$hdr" | grep -i '^content-security-policy:' | grep -F "font-src 'self'"
          echo "$hdr" | grep -i '^content-security-policy:' | grep -F "connect-src 'self'"
          echo "$hdr" | grep -i '^content-security-policy:' | grep -F "manifest-src 'self'"
          echo "$hdr" | grep -i '^content-security-policy:' | grep -F "base-uri 'none'"
          echo "$hdr" | grep -i '^content-security-policy:' | grep -F "form-action 'none'"
          echo "$hdr" | grep -i '^content-security-policy:' | grep -F "frame-ancestors 'none'"
          echo "$hdr" | grep -i '^content-security-policy:' | grep -F "upgrade-insecure-requests"
          echo "$hdr" | grep -i '^strict-transport-security:' | grep -F "max-age=63072000; includeSubDomains; preload"
          echo "$hdr" | grep -i '^x-content-type-options:' | grep -F nosniff
          echo "$hdr" | grep -i '^referrer-policy:' | grep -F strict-origin-when-cross-origin
          echo "$hdr" | grep -i '^permissions-policy:' | grep -F "camera=(), microphone=(), geolocation=(), interest-cohort=()"
          echo "$hdr" | grep -i '^cross-origin-opener-policy:' | grep -F same-origin
          echo "$hdr" | grep -i '^cross-origin-resource-policy:' | grep -F same-origin
          echo "$hdr" | grep -i '^cache-control:' | grep -F no-cache
          if echo "$hdr" | grep -qi '^server:'; then echo "Server header present"; exit 1; fi
          asset=$(curl -fsS http://127.0.0.1:8080/ | grep -oE '/_astro/[^" ]+' | head -1)
          test -n "$asset"
          ahdr=$(curl -sI "http://127.0.0.1:8080$asset")
          echo "$ahdr"
          echo "$ahdr" | grep -i '^cache-control:' | grep -F "public, max-age=31536000, immutable"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page)
          test "$code" = 404
          redir=$(curl -sI -H 'Host: totative.ca' http://127.0.0.1:8080/)
          echo "$redir"
          echo "$redir" | grep -qE '^HTTP/[^ ]+ 301'
          echo "$redir" | grep -i '^location:' | grep -F 'https://totative.dev/'
